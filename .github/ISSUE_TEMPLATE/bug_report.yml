name: Bug report
description: Something in MTG Inv isn't working.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This is a public page - please don't include passwords, tokens or your email address.
  - type: input
    id: version
    attributes:
      label: App version / build
      description: Filled in for you when you come from the app's "Report a problem" link.
      placeholder: "web 3146798 (2026-10-21)  /  iOS 1.0.0 (125)  /  Android 1.0.0 (91)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Screen or page
      description: Where in the app it happened.
      placeholder: "/decks/:id"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image in here. Hide anything private first.
